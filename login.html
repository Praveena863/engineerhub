<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EngineerHub - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            background: #f1f5ff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0px 5px 20px rgba(0,0,0,0.15);
            text-align: center;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            color: #1455d9;
            margin-bottom: 10px;
        }

        h2 {
            margin-bottom: 25px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            background: #1455d9;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0d3fa8;
        }

        .links {
            margin-top: 20px;
            font-size: 14px;
        }

        .links a {
            color: #1455d9;
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .message {
            margin-top: 15px;
            color: green;
            font-size: 14px;
        }

    </style>
</head>


<body>

    <div class="login-container">

        <div class="logo">
            EngineerHub
        </div>

        <h2>User Login</h2>


        <form onsubmit="loginUser(event)">

            <input 
            type="email" 
            id="email"
            placeholder="Enter Email"
            required>


            <input 
            type="password"
            id="password"
            placeholder="Enter Password"
            required>


            <button type="submit">
                Login
            </button>

        </form>


        <div class="message" id="message"></div>


        <div class="links">

            <p>
                <a href="#">
                    Forgot Password?
                </a>
            </p>

            <br>

            <p>
                Don't have an account?
                <a href="register.html">
                    Create Account
                </a>
            </p>

            <br>

            <p>
                <a href="index.html">
                    Back to Home
                </a>
            </p>

        </div>

    </div>



<script>

function loginUser(event)
{
    event.preventDefault();

    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;


    if(email !== "" && password !== "")
    {
        document.getElementById("message").innerHTML =
        "Login successful! Redirecting...";


        setTimeout(function()
        {
            window.location.href="dashboard.html";
        },2000);

    }

}

</script>


</body>
</html>
